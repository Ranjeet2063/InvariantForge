[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "invariant-forge"
version = "0.1.0"
description = "Autonomous Smart Contract Invariant Fuzzing & SMT Formal Verifier"
authors = [{ name = "Ranjeet2063" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "rich",
    "jinja2",
    "halmos"
]


[project.scripts]
invariant-forge = "invariant_forge.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["invariant_forge*"]

