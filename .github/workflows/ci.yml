name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Formal Verification & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install System Dependencies (Z3 SMT Solver)
        run: |
          sudo apt-get update
          sudo apt-get install -y z3 yices

      - name: Install Python Dependencies & Halmos
        run: |
          python -m pip install --upgrade pip
          pip install halmos pytest
          pip install -e .

      - name: Verify Environment & Toolchains
        run: |
          forge --version
          z3 --version
          halmos --version
          python -c "import invariant_forge; print('InvariantForge version:', invariant_forge.__file__)"

      - name: Build Foundry Contracts
        run: |
          cd testbed
          forge build

      - name: Run Foundry Invariant & PoC Unit Tests
        run: |
          cd testbed
          forge test --match-contract "PoC|SecureVault|Counter" -v

      - name: Run Halmos Formal SMT Verification
        run: |
          cd testbed
          halmos --contract SymbolicVaultProof --solver z3

      - name: Test InvariantForge CLI (Formal Verification Prover)
        run: |
          python -m invariant_forge.cli prove Vault --solver z3
          python -m invariant_forge.cli prove VulnerableVault --solver z3

      - name: Run Python Test Suite
        run: |
          PYTHONPATH=. pytest tests/ -v

